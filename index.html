<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ev Sumativa U1</title>
    <style>
          body {
            background-color: #f2f2f2;
            color: black;
            font-size: large;
            font-family: Arial, sans-serif;
            margin: 20px; 
          }
          .caja {
            color: darkblue;
            text-align: left;
            background-color: #d9f0ff;
            padding: 10px;
            width: 200px;
            height: 80px;
            border: 2px solid black;
          }
          input, button {
            padding: 5px;
            margin: 5px;
            border: 1px solid black;
            border-radius: 4px;
          }
    </style>

</head>
<body>
    <div class="caja">
  <h1>Formulario</h1>
</div> <br>
    <label>Nombre:</label>
    <input type="text" id="nombre" name="nombre"><br>
    <label>Apellido:</label>
    <input type="text" id="apellido" name="apellido"><br>
    <label>Email:</label>
    <input type="email" id="email" name="email"><br>
    <label>Edad:</label>
    <input type="number" id="edad" name="edad"><br>

    <button onclick="enviarFormulario()">Enviar</button><br><br>
    
    <div id="resultado">Aquí va el resultado</div>

    <!--Aquí va el JavaScript-->
    <script>
        function enviarFormulario() {
            let inputNombre = document.getElementById("nombre").value;
            let inputApellido = document.getElementById("apellido").value;
            let inputEmail = document.getElementById("email").value;
            let inputEdad = document.getElementById("edad").value;
            document.getElementById("resultado").textContent = "El resultado va aquí: " + inputNombre + " " + inputApellido + " " + inputEmail + " " + inputEdad; " "
        }

    </script>
</head>
<body>
    
</body>
</html>
